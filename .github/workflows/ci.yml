name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Builds first (pretest). End-to-end terminal tests run where node-pty is available and skip on Windows.
      - run: npm test

  package:
    name: Pack and smoke-test the published package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - name: Install the tarball globally and run it
        run: |
          npm install -g ./unfold-deploy-*.tgz
          unfold --version
          unfold demo build-failure --speed 50 --no-panel || test $? -eq 1
          unfold show | grep "Failed in"
